#==========================================================================
#  Build OpenWrt for OrangePi Zero3 (Allwinner H618) via GitHub Actions
#  Source: coolsnowwolf/lede  |  Based on P3TERX/Actions-OpenWrt
#  Same flow as the RE-SP-01B repo, plus: ccache carried between runs,
#  a seed check after defconfig, and a manifest check after compile.
#==========================================================================
name: Build OrangePi Zero3

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master
  FEEDS_CONF: ""
  CONFIG_FILE: config/zero3.config
  DIY_P1_SH: scripts/diy-part1.sh
  DIY_P2_SH: scripts/diy-part2.sh
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 355
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free up disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Free more disk space
        run: |
          # The private-repo runner has one ~73G disk and no /mnt; the action
          # above still leaves ~29G used. Run 40854958119 died of ENOSPC.
          sudo rm -rf /usr/share/swift /usr/local/.ghcup /opt/ghc /usr/lib/jvm /opt/az \
            /usr/share/miniconda /usr/local/share/powershell /usr/local/share/chromium \
            /opt/microsoft /opt/google /usr/local/lib/node_modules /usr/local/share/boost \
            /usr/share/az_* /opt/hostedtoolcache /usr/local/julia* /opt/mssql-tools \
            /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/kotlinc /usr/local/bin/minikube \
            /etc/skel/.cargo /home/runner/.rustup /home/runner/.cargo 2>/dev/null || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h / /mnt 2>/dev/null || true

      - name: Initialize environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk gcc-multilib g++-multilib gettext \
            genisoimage git gperf haveged help2man intltool libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev \
            libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev \
            libtool lld llvm lrzsz msmtp ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply \
            python3-docutils python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo \
            uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          sudo timedatectl set-timezone "$TZ"
          # Public-repo runners may also have a separate /mnt disk; build on
          # whichever of / and /mnt has more free space.
          df -h / /mnt 2>/dev/null || true
          ROOT_AV=$(df --output=avail / | tail -1)
          MNT_AV=$(df --output=avail /mnt 2>/dev/null | tail -1); MNT_AV=${MNT_AV:-0}
          if [ "$MNT_AV" -gt "$ROOT_AV" ]; then
            sudo mkdir -p /mnt/workdir && sudo ln -sfn /mnt/workdir /workdir
          else
            sudo mkdir -p /workdir
          fi
          sudo chown -h $USER:$GROUPS /workdir; sudo chown $USER:$GROUPS "$(readlink -f /workdir)"
          echo "CPU: $(nproc) cores"; free -h

      - name: Clone source code
        working-directory: /workdir
        run: |
          df -hT $PWD
          git clone --depth=1 $REPO_URL -b $REPO_BRANCH openwrt
          ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt
          echo "LEDE_COMMIT=$(git -C openwrt rev-parse --short HEAD)" >> $GITHUB_ENV

      # ccache (C/C++) + Go build cache, carried between runs. If a run hits
      # the step timeout, the next run resumes far faster.
      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: |
            openwrt/.ccache
            openwrt/tmp/go-build
          key: ccache-zero3-${{ github.run_id }}
          restore-keys: ccache-zero3-

      - name: Load custom feeds
        run: |
          [ -e "$FEEDS_CONF" ] && cp "$FEEDS_CONF" openwrt/feeds.conf.default
          chmod +x $DIY_P1_SH
          cd openwrt
          $GITHUB_WORKSPACE/$DIY_P1_SH

      - name: Update feeds
        run: cd openwrt && ./scripts/feeds update -a

      - name: Install feeds
        run: cd openwrt && ./scripts/feeds install -a

      - name: Load custom configuration
        run: |
          [ -e files ] && mv files openwrt/files
          [ -e "$CONFIG_FILE" ] && cp "$CONFIG_FILE" openwrt/.config
          chmod +x $DIY_P2_SH
          cd openwrt
          $GITHUB_WORKSPACE/$DIY_P2_SH

      - name: Download package
        id: package
        run: |
          cd openwrt
          make defconfig
          make download -j8
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: Seed check (requested =y that defconfig dropped)
        run: |
          cd openwrt
          grep -E '^CONFIG_PACKAGE_[^=]+=y' $GITHUB_WORKSPACE/$CONFIG_FILE | sed 's/=y$//' | sort -u > /tmp/seed.txt
          : > /tmp/dropped.txt
          while read -r sym; do
            grep -qx "${sym}=y" .config || echo "${sym#CONFIG_PACKAGE_}" >> /tmp/dropped.txt
          done < /tmp/seed.txt
          echo "requested: $(wc -l < /tmp/seed.txt)   dropped: $(wc -l < /tmp/dropped.txt)"
          cat /tmp/dropped.txt
          echo "=== firewall / transparent proxy backend ==="
          grep -E '^CONFIG_PACKAGE_(firewall4?|luci-app-passwall2?_(Ipt|Nft)[^=]*)=' .config || true

      - name: Compile the firmware
        id: compile
        timeout-minutes: 300
        run: |
          cd openwrt
          echo -e "$(nproc) thread compile"
          export CCACHE_MAXSIZE=4G
          # Disk watchdog: a runner that dies of ENOSPC uploads no log at all,
          # so print usage every 10 min (and the biggest dirs when it gets low).
          ( while sleep 600; do
              echo "::group::disk $(date +%H:%M)"; df -h "$(readlink -f /workdir)" | tail -1
              [ "$(df --output=avail "$(readlink -f /workdir)" | tail -1)" -lt 8000000 ] && \
                du -xsh build_dir/* staging_dir/* dl tmp .ccache 2>/dev/null | sort -h | tail -12
              echo "::endgroup::"
            done ) &
          # IGNORE_ERRORS=1: one broken package must not sink a multi-hour run;
          # the manifest check below lists anything that didn't make it.
          make -j$(nproc) IGNORE_ERRORS=1 || make -j1 V=s IGNORE_ERRORS=1
          ls bin/targets/*/*/*.img.gz
          echo "status=success" >> $GITHUB_OUTPUT
          grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
          [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
          echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            openwrt/.ccache
            openwrt/tmp/go-build
          key: ccache-zero3-${{ github.run_id }}

      - name: Manifest check & size report
        if: (!cancelled())
        run: |
          cd openwrt
          ls -la bin/targets/*/*/ 2>/dev/null | grep -vE '\.ipk$' || true
          MF=$(ls bin/targets/*/*/*.manifest 2>/dev/null | head -1)
          if [ -n "$MF" ]; then
            cut -d' ' -f1 "$MF" | sort -u > /tmp/installed.txt
            echo "installed packages: $(wc -l < /tmp/installed.txt)"
            : > /tmp/missing.txt
            grep -E '^CONFIG_PACKAGE_[^=]+=y' $GITHUB_WORKSPACE/$CONFIG_FILE | sed 's/^CONFIG_PACKAGE_//; s/=y$//' \
              | grep -v '_INCLUDE_\|_Iptables_\|_Nftables_' | sort -u | while read -r p; do
                grep -qx "$p" /tmp/installed.txt || echo "$p" >> /tmp/missing.txt
              done
            echo "=== requested but NOT in image ($(wc -l < /tmp/missing.txt)) ==="
            cat /tmp/missing.txt
          fi
          echo "=== failed package builds (logs) ==="
          ls logs/package/*/*/compile.txt 2>/dev/null | xargs -r grep -l 'Error [0-9]' 2>/dev/null | head -50 || true
          df -hT /workdir

      - name: Organize files
        id: organize
        if: env.UPLOAD_FIRMWARE == 'true' && steps.compile.outputs.status == 'success' && !cancelled()
        run: |
          cd openwrt
          {
            echo "lede master @ ${LEDE_COMMIT}"
            echo
            echo "Flash: gunzip the *sdcard.img.gz (squashfs) and dd it to a SPARE SD card."
            echo "Boots on 192.168.1.2, DHCP off, gateway/DNS 192.168.1.1. root password = lede default."
            echo
            echo "Requested but not in image:"
            cat /tmp/missing.txt 2>/dev/null || echo "(none)"
          } > $GITHUB_WORKSPACE/release.txt
          cd bin/targets/*/*
          rm -rf packages
          echo "FIRMWARE=$PWD" >> $GITHUB_ENV
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Upload firmware to artifacts
        uses: actions/upload-artifact@v4
        if: steps.organize.outputs.status == 'success' && !cancelled()
        with:
          name: OpenWrt_zero3${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
          path: ${{ env.FIRMWARE }}

      - name: Generate release tag
        id: tag
        if: env.UPLOAD_RELEASE == 'true' && steps.organize.outputs.status == 'success' && !cancelled()
        run: |
          echo "release_tag=Zero3_$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Upload firmware to release
        uses: softprops/action-gh-release@v2
        if: steps.tag.outputs.status == 'success' && !cancelled()
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          files: ${{ env.FIRMWARE }}/*
          body_path: release.txt
